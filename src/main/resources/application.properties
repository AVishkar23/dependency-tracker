spring.application.name=dependency-tracker

# PostgreSQL by default (docker-compose provides it). Override with env vars in real deployments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/deptracker}
spring.datasource.username=${DB_USERNAME:deptracker}
spring.datasource.password=${DB_PASSWORD:deptracker}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
